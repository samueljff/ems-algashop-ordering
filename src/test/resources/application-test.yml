spring:
  application:
    name: ordering
  datasource:
    url: 'jdbc:h2:mem:ordering-test;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE'
    username: sa
    password: '123'
  h2:
    console:
      enabled: true
      settings:
        web-allow-others: true
  jpa:
    database-platform: 'org.hibernate.dialect.H2Dialect'
    hibernate:
      ddl-auto: 'create-drop'
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

algashop:
  integrations:
    shipping.provider: "RAPIDEX"
    rapidex.url: "http://localhost:8780"
    product-catalog.url: "http://localhost:8781"