buildscript {
    dependencies {
        classpath 'org.flywaydb:flyway-core:12.6.1'
        classpath 'org.flywaydb:flyway-database-postgresql:12.6.1'
    }
}

plugins {
    id 'idea'
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.springframework.cloud.contract' version '4.3.0'
    id("org.flywaydb.flyway") version "12.6.1"
}

group = 'com.fonseca.algashop'
version = '0.0.1-SNAPSHOT'
description = 'Ordering microservice'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    mockitoAgent
}

repositories {
    mavenCentral()
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

ext {
    set('springCloudVersion', "2025.0.0")
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'com.fasterxml.uuid:java-uuid-generator:5.1.0'
    implementation 'commons-validator:commons-validator:1.9.0'
    implementation 'io.hypersistence:hypersistence-tsid:2.1.4'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.modelmapper:modelmapper:3.2.4'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.rest-assured:rest-assured'
    testImplementation 'io.rest-assured:spring-mock-mvc'
    testImplementation 'org.assertj:assertj-core:3.27.3'
    testImplementation 'org.springframework.cloud:spring-cloud-starter-contract-verifier'
    testImplementation 'org.springframework.cloud:spring-cloud-starter-contract-stub-runner'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
    mockitoAgent('org.mockito:mockito-core:5.14.2') { transitive = false }
}

contracts {
    packageWithBaseClasses = "com.fonseca.algashop.ordering.contract.base"
}

tasks.named('contractTest') {
    useJUnitPlatform()
}

tasks.named('test') {
    useJUnitPlatform()
}

def mockitoJvmArgs = [
    "-javaagent:${configurations.mockitoAgent.asPath}",
    "-Xshare:off" // Desabilita Class Data Sharing para evitar warning de bootstrap classpath
]

test {
    filter {
        excludeTestsMatching("*IT")
    }
    jvmArgs += mockitoJvmArgs
}

tasks.named('check') {
    dependsOn(test, contractTest, integrationTest)
}

tasks.register('integrationTest', Test) {
    description = 'Run integrationTest.'
    group = 'verification'
    jvmArgs += mockitoJvmArgs
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter test
    useJUnitPlatform()
    testLogging {
        events('passed')
    }

    filter {
        includeTestsMatching "*IT"
        excludeTestsMatching "*Test"
    }
}
